# A lab's site file: its hosts, scratch space, tools and bot commands. Copy this whole
# directory to ~/.config/edarunner/ so that the hooks are found at {site_dir}/hooks.
# Every host, server and path below is a placeholder. A lab keeps its real copy in a
# private repository, because that file names its machines. Each user's chat and bot
# token go into user.toml next to this file, and .gitignore keeps them out of git.
schema = 1

# On each host, run trees go into the largest writable directory in this list.
scratch = ["/scratch", "/tmp"]

# EDR_RUNTIME tells croc/hooks/container.sh how this site runs a tool image: oseda,
# apptainer, singularity, docker or none. If you leave it out, the hook uses the first
# one it finds on PATH. EDR_SIF_DIR is where `singularity pull` saved the images, named
# <name>_<tag>.sif.
env = { EDR_SIF_DIR = "$HOME/sif" }

ssh = { options = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=10"], timeout_s = 45 }

# Tool processes that `edr hosts` counts and that the orphan check looks for.
tool_procs = "^(yosys|openroad|klayout)$"

# The head node itself, which edr reaches without ssh. Enter its real cores and RAM.
# No run starts on a host whose scratch has less than host_free_min_gb free. The default
# is 100 GB, and 10 lets the walkthrough run on a small disk.
[hosts.local]
cores = 4
ram_gb = 16
host_free_min_gb = 10

# Two compute hosts, reached over ssh with a key and without a password prompt. Remove
# the comment marks and enter the real names; `edr check` will then probe each one.
# [hosts.hostA]
# cores = 64
# ram_gb = 256
#
# [hosts.hostB]
# cores = 128
# ram_gb = 512
# tools = ["yosys", "openroad"]    # a list names the tools the host has; this one has no klayout

# The open tools don't need licence seats, so they have no probe. A host either has
# them or it doesn't.
[tools.yosys]
[tools.openroad]
[tools.klayout]

# A tool behind a FlexLM licence server gets a probe. The driver runs it on the host
# before the stage starts, and waits while fewer seats are free than the stage needs.
# The hook has to exist at this path on every host, so keep the site directory on a
# shared filesystem.
# [tools.fc]
# seats = 20
# probe = ["bash", "{site_dir}/hooks/flexlm_free.sh", "27000@licence.example.com", "FEATURE-NAME"]

# Each user sets up a Telegram bot of their own in user.toml, with its token, chat and
# user id; README.md shows how. The site file holds only the lab's bot commands, which
# every user's bot offers. A command runs a program on the head node. With this one,
# /survey prints the host table.
# [telegram.commands.survey]
# help = "free cores, RAM and scratch on every host"
# run = ["bash", "{site_dir}/hooks/machine_check.sh", "-c", "16", "-g", "80"]
# timeout_s = 90
